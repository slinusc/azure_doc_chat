name: Deploy Application

on:
  push:
    branches: [main]

env:
  REGISTRY: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io
  IMAGE_NAME: rag-backend

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    outputs:
      app-service-name: ${{ steps.bicep.outputs.appServiceName }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep template
        id: bicep
        run: |
          az deployment group create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters location=eastus environmentName=prod

  build-and-push-image:
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR credentials
        id: acr
        run: |
          az acr credential show --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_REGISTRY_NAME }} \
            --query 'passwords[0].value' -o tsv > acr_password.txt

      - name: Build and push Docker image
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az acr build \
              --registry ${{ secrets.AZURE_REGISTRY_NAME }} \
              --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --image ${{ env.IMAGE_NAME }}:latest \
              --file backend/Dockerfile \
              backend/

  deploy-app:
    needs: [deploy-infra, build-and-push-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ needs.deploy-infra.outputs.app-service-name }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Configure App Service settings
        run: |
          az webapp config appsettings set \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ needs.deploy-infra.outputs.app-service-name }} \
            --settings \
              WEBSITES_PORT=5000 \
              DOCKER_REGISTRY_SERVER_URL=https://${{ env.REGISTRY }} \
              DOCKER_REGISTRY_SERVER_USERNAME=$(az acr credential show --name ${{ secrets.AZURE_REGISTRY_NAME }} --query username -o tsv) \
              DOCKER_REGISTRY_SERVER_PASSWORD=$(az acr credential show --name ${{ secrets.AZURE_REGISTRY_NAME }} --query 'passwords[0].value' -o tsv)

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Static Web App
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend'
          app_artifact_location: ''
          skip_app_build: true
